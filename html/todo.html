<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="">
  <title>Todo App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  
  <div class="main-container">

  <!-- Header -->
  <header>
    <div class="header-info">
      <h1 class="header-title">
        todos
      </h1>
      <p class="header-subtext">
        Stay Organized, Stay Productive
      </p>
    </div>

    <div class="header-meta">
      <p class="header-date">
        Wednesday, Sept 17, 2026
      </p>
    </div>
  </header>

  <!--Main-->
  <main>
    <div class="search-container">
      <input type="text" class="search" placeholder="Seach todo items">
    </div>

    <div class="add-container">
      <input class="add-input" type="text" placeholder="Add Items">
      <button class="add-button" id="add-button">Add</button>
    </div>

    <div class="list-container">
      <ul class="list">
          <li class="list-item">
            <div class="list-title">
              <p>Programming practice</p>
            </div>

            <div class="list-buttons">
              <button class="list__button" id="list__delete">
                      <img class="list__icon" id="list__icon--delete" src="../assets/delete-icon.svg" alt="Delete">
              </button>

              <button class="list__button" id="list__edit">
                      <img class="list__icon" id="list__icon--edit" src="../assets/edit-icon.svg" alt="edit">
              </button>
            </div>
          </li>
      </ul>

    </div>
  </main>
    
  </div>

  <div class="modal">
    <div class="modal-content">
      <div class="modal-title">
        <h3>Edit Title</h3>
      </div>

      <div class="modal-body">
            <input type="text" class="modal-input" placeholder="Enter New Title">
            <div class="modal-buttons">
                <button class="modal-submit">Submit</button>
                <button class="modal-cancel">Cancel</button>
            </div>
      </div>
    </div>
  </div>

  <div class="alert">
    <figure class="alert__figure">
      <img src="../assets/success-icon.svg" alt="alert-image" class="alert__image">
    </figure>
    <h4 class="alert__title" id="alert__title"></h4>
  </div>

  <script src="../scripts/script.js"></script>
</body>
</html>
